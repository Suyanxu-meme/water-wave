<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>纯净水膜 · 玻璃折射</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: -apple-system, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #cam { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #trailCanvas { display: none; }
  
  .hud { position: fixed; top: 24px; left: 24px; padding: 16px 20px; border-radius: 16px; background: rgba(10, 15, 25, 0.5); border: 1px solid rgba(200, 220, 255, 0.2); backdrop-filter: blur(10px); pointer-events: none; z-index: 10; }
  .hud .title { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #e0f0ff; text-shadow: 0 0 10px rgba(200, 220, 255, 0.5); }
  .hud .sub { margin-top: 6px; font-size: 11px; color: rgba(220, 230, 255, 0.6); }
  
  .preview-wrap { position: fixed; right: 20px; bottom: 20px; width: 140px; height: 105px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(200, 220, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; transition: opacity 0.5s ease; transform: scaleX(-1); z-index: 10; opacity: 0; }
  .preview-wrap.active { opacity: 1; }
  #preview { display: block; width: 100%; height: 100%; }
  
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 50; transition: opacity 0.8s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(200, 220, 255, 0.2); border-top-color: #e0f0ff; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 13px; letter-spacing: 2px; color: #e0f0ff; }
</style>
</head>
<body>
<div id="app"></div>
<video id="cam" playsinline muted autoplay></video>
<canvas id="trailCanvas"></canvas>

<div class="hud">
  <div class="title">纯净水膜</div>
  <div class="sub">滑动屏幕或挥手 · 划开透明水膜</div>
</div>
<div class="preview-wrap" id="previewWrap"><canvas id="preview" width="140" height="105"></canvas></div>
<div id="loading"><div class="spinner"></div><div class="text">正在生成水面…</div></div>

<script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const container = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const videoEl = document.getElementById('cam');

// 画布：用于记录水面高度（法线）
const trailCanvas = document.getElementById('trailCanvas');
const ctx = trailCanvas.getContext('2d', { willReadFrequently: true });
trailCanvas.width = 512;
trailCanvas.height = 512;

const trailTexture = new THREE.CanvasTexture(trailCanvas);
trailTexture.minFilter = THREE.LinearFilter;
trailTexture.magFilter = THREE.LinearFilter;

let videoTexture = null;

// ================= 核心 Shader =================
const mainMat = new THREE.ShaderMaterial({
  uniforms: {
    uVideo: { value: null },
    uTrail: { value: trailTexture },
    uVideoAspect: { value: 1.0 },
    uAspect: { value: window.innerWidth / window.innerHeight }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D uVideo;
    uniform sampler2D uTrail;
    uniform float uVideoAspect;
    uniform float uAspect;
    varying vec2 vUv;

    void main() {
      // 1. 视频 Cover 适配
      vec2 uv = vUv;
      vec2 scale = vec2(1.0);
      if (uAspect > uVideoAspect) {
        scale.y = uVideoAspect / uAspect;
      } else {
        scale.x = uAspect / uVideoAspect;
      }
      uv = (uv - 0.5) * scale + 0.5;

      // 2. 获取高度图信息
      float trail = texture2D(uTrail, vUv).r;

      // 3. 计算梯度 (法线)，提取水面的凹凸
      float texel = 1.0 / 512.0;
      float tL = texture2D(uTrail, vUv - vec2(texel, 0.0)).r;
      float tR = texture2D(uTrail, vUv + vec2(texel, 0.0)).r;
      float tT = texture2D(uTrail, vUv + vec2(0.0, texel)).r;
      float tB = texture2D(uTrail, vUv - vec2(0.0, texel)).r;

      // 核心梯度
      vec2 grad = vec2(tL - tR, tT - tB);
      
      // 4. 强力折射扭曲 (模拟玻璃球)
      // 使用 1.5 的放大系数，手一划，背后的世界就像被水珠放大一样扭曲
      vec2 distortedUv = uv + grad * 1.5;

      // 5. 色散效果 (RGB 分离，极微弱)
      // 水有厚度，不同波长的光折射率不同，加了这个才像水
      vec2 chromatic = grad * 0.05; 
      float r = texture2D(uVideo, distortedUv + chromatic).r;
      float g = texture2D(uVideo, distortedUv).g;
      float b = texture2D(uVideo, distortedUv - chromatic).b;
      vec3 videoColor = vec3(r, g, b);

      // 6. 边缘高光 (纯白色 / 极淡的银色)
      float gradMag = length(grad);
      
      // 提取水面边缘(波峰)
      float whiteEdge = smoothstep(0.05, 0.2, gradMag);
      
      // 叠加纯白高光
      vec3 finalColor = videoColor.rgb;
      finalColor += vec3(1.0) * whiteEdge * 0.8;

      // 增加水内部的通透提亮（一点点就行，保持完全透明）
      finalColor += vec3(0.02) * smoothstep(0.0, 1.0, trail);

      // 7. 极其轻微的暗角，凸显水膜中心
      float distToCenter = distance(vUv, vec2(0.5));
      finalColor *= smoothstep(1.0, 0.3, distToCenter);

      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});

const mainMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mainMat);
scene.add(mainMesh);

// ================= 交互：绘制水膜 =================
function addPointer(x, y) {
  const nx = x;
  const ny = 1.0 - y; 
  
  // 画笔加大到 35，让水膜更大、更连片
  ctx.beginPath();
  ctx.arc(nx * 512, ny * 512, 35, 0, Math.PI * 2); 
  ctx.fillStyle = 'rgba(255, 255, 255, 1)';
  ctx.fill();
}

window.addEventListener('pointerdown', e => { 
  addPointer(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
}, true);

window.addEventListener('pointermove', e => {
  if (e.buttons === 1 || e.pointerType === 'touch') { // 左键按下或触摸
    addPointer(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
  }
}, true);

// ================= MediaPipe 手势 =================
const previewWrap = document.getElementById('previewWrap');
const previewCv = document.getElementById('preview');
const pctx = previewCv.getContext('2d');
const CDN = 'https://unpkg.com/@mediapipe/hands@0.4.1675469240';

async function initHands() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    videoEl.srcObject = stream; await videoEl.play();
    
    videoTexture = new THREE.VideoTexture(videoEl);
    mainMat.uniforms.uVideo.value = videoTexture;
    
    const aspectUpdate = () => {
      if (videoEl.videoWidth > 0) {
        mainMat.uniforms.uVideoAspect.value = videoEl.videoWidth / videoEl.videoHeight;
      }
    };
    videoEl.addEventListener('loadedmetadata', aspectUpdate);
    aspectUpdate();
    
  } catch (err) { console.warn('摄像头未授权'); return; }
  
  if (typeof window.Hands === 'undefined') return;
  
  const hands = new window.Hands({ locateFile: (file) => `${CDN}/${file}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 0 });
  
  hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const indexTip = lm[8];
      
      // 指尖划过水面
      addPointer(1.0 - indexTip.x, indexTip.y);
      
      drawPreview(lm);
      previewWrap.classList.add('active');
    } else {
      drawPreview(null);
    }
  });

  (async function pump() {
    if (videoEl.readyState >= 2) { try { await hands.send({ image: videoEl }); } catch (e) {} }
    requestAnimationFrame(pump);
  })();
}

const HAND_CONNECTIONS = window.HAND_CONNECTIONS || [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawPreview(lm) {
  const W = previewCv.width, H = previewCv.height; 
  pctx.clearRect(0, 0, W, H);
  if (videoEl.readyState >= 2) { pctx.drawImage(videoEl, 0, 0, W, H); pctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; pctx.fillRect(0, 0, W, H); }
  if (!lm) return;
  pctx.lineWidth = 2; pctx.strokeStyle = 'rgba(200, 220, 255, 0.8)'; pctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) { pctx.moveTo(lm[a].x * W, lm[a].y * H); pctx.lineTo(lm[b].x * W, lm[b].y * H); }
  pctx.stroke();
  for (let i = 0; i < lm.length; i++) {
    pctx.beginPath(); pctx.arc(lm[i].x * W, lm[i].y * H, (i === 8) ? 3.5 : 2, 0, Math.PI * 2);
    pctx.fillStyle = i === 8 ? '#fff' : 'rgba(255,255,255,0.8)'; pctx.fill();
  }
}

// ================= 动画与消散 =================
function animate() {
  requestAnimationFrame(animate);

  // 每隔一帧擦除一点点，让水膜保留，形成连贯的液体感 (从 0.02 调整为 0.03)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
  ctx.fillRect(0, 0, 512, 512);

  trailTexture.needsUpdate = true;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  mainMat.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
});

initHands().finally(() => setTimeout(() => document.getElementById('loading').classList.add('done'), 500));
setTimeout(() => { document.getElementById('loading').classList.add('done'); }, 3000);
animate();
</script>
</body>
</html>
