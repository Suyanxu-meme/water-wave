<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>触碰水面 · 极简水波</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02060d; }
  body { font-family: -apple-system, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #cam { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  
  .hud { position: fixed; top: 24px; left: 24px; padding: 16px 20px; border-radius: 16px; background: rgba(5, 15, 30, 0.5); border: 1px solid rgba(100, 200, 255, 0.15); backdrop-filter: blur(10px); pointer-events: none; z-index: 10; }
  .hud .title { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #a0e0ff; }
  .hud .sub { margin-top: 6px; font-size: 11px; color: rgba(200, 240, 255, 0.6); }
  
  .preview-wrap { position: fixed; right: 20px; bottom: 20px; width: 160px; height: 120px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(100, 200, 255, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; transition: opacity 0.5s ease; transform: scaleX(-1); z-index: 10; opacity: 0; }
  .preview-wrap.active { opacity: 1; }
  #preview { display: block; width: 100%; height: 100%; }
  
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #02060d; z-index: 50; transition: opacity 0.8s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(0, 180, 219, 0.2); border-top-color: #64ffda; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 13px; letter-spacing: 2px; color: #64ffda; }
  @media (max-width: 640px) {
    .preview-wrap { width: 120px; height: 90px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<video id="cam" playsinline muted autoplay></video>

<div class="hud">
  <div class="title">触碰水面</div>
  <div class="sub">滑动屏幕或挥手 · 划开真实水波</div>
</div>
<div class="preview-wrap" id="previewWrap"><canvas id="preview" width="160" height="120"></canvas></div>
<div id="loading"><div class="spinner"></div><div class="text">正在注水…</div></div>

<script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// 1. 基础设置
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02060d);
scene.fog = new THREE.FogExp2(0x02060d, 0.04);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// 2. 水面材质 (纯 Shader 渲染)
const waterGeo = new THREE.PlaneGeometry(40, 40, 256, 256);
waterGeo.rotateX(-Math.PI / 2);

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uIsTouching: { value: 0.0 }
  },
  vertexShader: `
    uniform float uTime;
    uniform vec2 uMouse;
    uniform float uIsTouching;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vElevation;

    void main() {
      vec3 pos = position;
      
      // 基础连绵不断的微波
      float wave = sin(pos.x * 1.5 + uTime) * 0.1;
      wave += cos(pos.z * 1.2 + uTime * 0.8) * 0.1;
      
      // 鼠标/手势触摸产生的波纹（以鼠标坐标为中心的圆形波）
      vec2 mousePos = (uMouse - 0.5) * 40.0; // 映射到 40x40 的平面
      float dist = distance(pos.xz, mousePos);
      float ripple = sin(dist * 2.0 - uTime * 8.0) * 0.5;
      ripple *= smoothstep(6.0, 0.0, dist) * uIsTouching; // 距离越近波纹越强
      
      pos.y += wave + ripple;
      vElevation = pos.y;

      // 计算法线 (用于光照)
      float dx = cos(pos.x * 1.5 + uTime) * 1.5 * 0.1;
      float dz = -sin(pos.z * 1.2 + uTime * 0.8) * 1.2 * 0.1;
      vNormal = normalize(vec3(-dx, 1.0, -dz));

      vec4 worldPos = modelMatrix * vec4(pos, 1.0);
      vWorldPos = worldPos.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vElevation;

    void main() {
      // 光照与视角
      vec3 lightDir = normalize(vec3(2.0, 5.0, 2.0));
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      
      // 漫反射与高光
      vec3 halfDir = normalize(lightDir + viewDir);
      float spec = pow(max(dot(vNormal, halfDir), 0.0), 128.0);
      
      // 菲涅尔反射 (视线越平，水面越像镜子反射天空)
      float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 4.0);
      
      // 颜色混合
      vec3 deepColor = vec3(0.01, 0.03, 0.08);    // 深水
      vec3 shallowColor = vec3(0.1, 0.3, 0.4);    // 浅水
      vec3 skyColor = vec3(0.2, 0.4, 0.6);        // 天空反射色
      
      // 根据波峰波谷混合深水和浅水
      vec3 waterColor = mix(deepColor, shallowColor, smoothstep(-0.1, 0.2, vElevation));
      
      // 最终合成：水色 + 天空反射 + 太阳高光
      vec3 finalColor = mix(waterColor, skyColor, fresnel);
      finalColor += vec3(1.0) * spec * 3.0;

      // 远处雾化融入背景
      float distToCam = length(cameraPosition - vWorldPos);
      finalColor = mix(finalColor, vec3(0.01, 0.02, 0.05), smoothstep(6.0, 18.0, distToCam));

      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});

const waterMesh = new THREE.Mesh(waterGeo, waterMat);
scene.add(waterMesh);

// 3. 鼠标与触摸事件
let pointerIsDown = false;
let pointerUV = new THREE.Vector2(0.5, 0.5);

window.addEventListener('pointerdown', e => { 
  pointerIsDown = true; 
  pointerUV.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight); 
}, true);
window.addEventListener('pointerup', () => pointerIsDown = false, true);
window.addEventListener('pointercancel', () => pointerIsDown = false, true);
window.addEventListener('pointermove', e => {
  if (pointerIsDown) {
    pointerUV.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
  }
}, true);

// 4. 手势识别
const videoEl = document.getElementById('cam');
const previewWrap = document.getElementById('previewWrap');
const previewCv = document.getElementById('preview');
const pctx = previewCv.getContext('2d');
const CDN = 'https://unpkg.com/@mediapipe/hands@0.4.1675469240';

async function initHands() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    videoEl.srcObject = stream; await videoEl.play();
  } catch (err) { console.warn('摄像头未授权'); return; }
  
  if (typeof window.Hands === 'undefined') return;
  
  const hands = new window.Hands({ locateFile: (file) => `${CDN}/${file}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 0 });
  
  hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const indexTip = lm[8];
      pointerUV.set(1.0 - indexTip.x, 1.0 - indexTip.y);
      pointerIsDown = true;
      drawPreview(lm);
      previewWrap.classList.add('active');
    } else {
      pointerIsDown = false;
      drawPreview(null);
    }
  });

  (async function pump() {
    if (videoEl.readyState >= 2) { try { await hands.send({ image: videoEl }); } catch (e) {} }
    requestAnimationFrame(pump);
  })();
}

const HAND_CONNECTIONS = window.HAND_CONNECTIONS || [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawPreview(lm) {
  const W = previewCv.width, H = previewCv.height; 
  pctx.clearRect(0, 0, W, H);
  if (videoEl.readyState >= 2) { pctx.drawImage(videoEl, 0, 0, W, H); pctx.fillStyle = 'rgba(0, 10, 20, 0.5)'; pctx.fillRect(0, 0, W, H); }
  if (!lm) return;
  pctx.lineWidth = 2; pctx.strokeStyle = 'rgba(100, 255, 218, 0.8)'; pctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) { pctx.moveTo(lm[a].x * W, lm[a].y * H); pctx.lineTo(lm[b].x * W, lm[b].y * H); }
  pctx.stroke();
  for (let i = 0; i < lm.length; i++) {
    pctx.beginPath(); pctx.arc(lm[i].x * W, lm[i].y * H, (i === 8) ? 3.5 : 2, 0, Math.PI * 2);
    pctx.fillStyle = i === 8 ? '#64ffda' : '#fff'; pctx.fill();
  }
}

// 5. 动画主循环
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  waterMat.uniforms.uTime.value = time;
  // 平滑鼠标坐标
  waterMat.uniforms.uMouse.value.lerp(pointerUV, 0.1);
  // 平滑触摸强度
  const targetTouch = pointerIsDown ? 1.0 : 0.0;
  waterMat.uniforms.uIsTouching.value += (targetTouch - waterMat.uniforms.uIsTouching.value) * 0.1;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

initHands().finally(() => setTimeout(() => document.getElementById('loading').classList.add('done'), 500));
setTimeout(() => document.getElementById('loading').classList.add('done'), 3000);
animate();
</script>
</body>
</html>
